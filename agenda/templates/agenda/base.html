<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Agenda de Contactos{% endblock %}</title>
    <meta name="description" content="Gestión sencilla de contactos personales con Django.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa6mY5Qe1Vh8kFckWWEpZ4hKkcaKJSL5lF/U8xU5tiOb5M81hzJ6Z7pr+Bw" crossorigin="anonymous">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff, #e0e7ff); }
        .card { backdrop-filter: blur(8px); background: rgba(255,255,255,0.8); border: none; }
        .nav-link.active { font-weight: 600; }
        .hover-shadow:hover { box-shadow: 0 4px 12px rgba(0,0,0,.15); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'agenda:contact_list' %}">Agenda de Contactos</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'agenda:contact_add' %}">Agregar Contacto</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+0G+QgJtI5E302G3pFoVf5VXe6V0k" crossorigin="anonymous"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
